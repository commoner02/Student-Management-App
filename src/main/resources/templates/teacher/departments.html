<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Departments</title>
</head>
<body>
<h2>All Departments</h2>

<div th:if="${success}" style="color: green" th:text="${success}"></div>

<a th:href="@{/teacher/add-department}">Add New Department</a><br><br>

<table border="1">
    <thead>
    <tr>
        <th>Department Code</th>
        <th>Department Name</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="department : ${departments}">
        <td th:text="${department.code}"></td>
        <td th:text="${department.name}"></td>
        <td>
            <a th:href="@{'/teacher/edit-department/' + ${department.id}}">Edit</a> |
            <a th:href="@{'/teacher/delete-department/' + ${department.id}}"
               onclick="return confirm('Are you sure? This will affect all associated students and courses!')">Delete</a>
        </td>
    </tr>
    </tbody>
</table>

<a th:href="@{/teacher/dashboard}">Back to Dashboard</a>
</body>
</html>
