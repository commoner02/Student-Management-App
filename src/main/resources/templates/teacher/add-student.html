<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
</head>
<body>
<h2>Add New Student</h2>

<div th:if="${error}" style="color: red" th:text="${error}"></div>
<div th:if="${success}" style="color: green" th:text="${success}"></div>

<form th:action="@{/teacher/add-student}" method="post">
    <div>
        <label>Username:</label>
        <input type="text" name="username" required>
    </div>
    <div>
        <label>Password:</label>
        <input type="password" name="password" required>
    </div>
    <div>
        <label>Email:</label>
        <input type="email" name="email" required>
    </div>
    <div>
        <label>Student ID/Roll:</label>
        <input type="text" name="studentId" required>
    </div>
    <div>
        <label>Phone:</label>
        <input type="text" name="phone">
    </div>
    <div>
        <label>Address:</label>
        <input type="text" name="address">
    </div>
    <div>
        <label>Department:</label>
        <select name="departmentId">
            <option th:each="dept : ${departments}"
                    th:value="${dept.id}"
                    th:text="${dept.name + ' (' + dept.code + ')'}"></option>
        </select>
    </div>
    <button type="submit">Add Student</button>
</form>

<a th:href="@{/teacher/students}">Back to Students List</a>
</body>
</html>
