<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Student</title>
</head>
<body>
<h2>Edit Student</h2>

<div th:if="${error}" style="color: red" th:text="${error}"></div>

<form th:action="@{'/teacher/update-student/' + ${student.id}}" method="post">
    <div>
        <label>Student ID/Roll:</label>
        <input type="text" th:value="${student.studentId}" readonly>
    </div>
    <div>
        <label>Email:</label>
        <input type="email" name="email" th:value="${student.user.email}" required>
    </div>
    <div>
        <label>Phone:</label>
        <input type="text" name="phone" th:value="${student.phone}">
    </div>
    <div>
        <label>Address:</label>
        <input type="text" name="address" th:value="${student.address}">
    </div>
    <div>
        <label>Department:</label>
        <select name="departmentId">
            <option th:each="dept : ${departments}"
                    th:value="${dept.id}"
                    th:text="${dept.name}"
                    th:selected="${dept.id == student.department.id}">
            </option>
        </select>
    </div>
    <button type="submit">Update Student</button>
    <a th:href="@{/teacher/students}">Cancel</a>
</form>
</body>
</html>
