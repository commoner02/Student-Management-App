<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enroll Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h2 class="mb-4">Enroll Student in Course</h2>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h5>New Enrollment</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/teacher/enroll-student}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Select Student:</label>
                            <select class="form-select" name="studentId" required>
                                <option value="">-- Select Student --</option>
                                <option th:each="student : ${students}"
                                        th:value="${student.id}"
                                        th:text="${student.studentId + ' - ' + student.username}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Select Course:</label>
                            <select class="form-select" name="courseId" required>
                                <option value="">-- Select Course --</option>
                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.code + ' - ' + course.name}">
                                </option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Enroll Student</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5>Current Enrollments</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                            <tr>
                                <th>Student</th>
                                <th>Courses</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="student : ${students}">
                                <td th:text="${student.studentId + ' - ' + student.username}"></td>
                                <td>
                                            <span th:if="${student.courseCodes.size() > 0}">
                                                <span th:each="course, iter : ${student.courseCodes}"
                                                      th:text="${course} + ${!iter.last ? ', ' : ''}"></span>
                                            </span>
                                    <span th:if="${student.courseCodes.size() == 0}" class="text-muted">
                                                No courses enrolled
                                            </span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/teacher/dashboard}" class="btn btn-secondary">Back to Dashboard</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
