<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Student Courses</title>
</head>
<body>
<h2>Manage Courses for <span th:text="${student.studentId + ' - ' + student.user.username}"></span></h2>

<div th:if="${error}" style="color: red" th:text="${error}"></div>
<div th:if="${success}" style="color: green" th:text="${success}"></div>

<h3>Current Enrolled Courses:</h3>
<ul th:if="${student.courses.size() > 0}">
    <li th:each="course : ${student.courses}">
        <span th:text="${course.code + ' - ' + course.name}"></span>
        <a th:href="@{'/teacher/remove-course-from-student/' + ${student.id} + '/' + ${course.id}}"
           onclick="return confirm('Remove student from this course?')"
           style="color: red; margin-left: 10px;">[Remove]</a>
    </li>
</ul>
<p th:if="${student.courses.size() == 0}">No courses enrolled yet.</p>

<h3>Enroll in New Course:</h3>
<form th:action="@{'/teacher/enroll-student-course/' + ${student.id}}" method="post">
    <div>
        <label>Select Course:</label>
        <select name="courseId" required>
            <option value="">-- Select Course --</option>
            <option th:each="course : ${availableCourses}"
                    th:value="${course.id}"
                    th:text="${course.code + ' - ' + course.name + ' (' + course.department.name + ')'}">
            </option>
        </select>
    </div>
    <button type="submit">Enroll in Course</button>
</form>

<br>
<a th:href="@{/teacher/enroll-student}">Back to Enrollment Page</a> |
<a th:href="@{/teacher/students}">Back to Students</a> |
<a th:href="@{/teacher/dashboard}">Back to Dashboard</a>
</body>
</html>
