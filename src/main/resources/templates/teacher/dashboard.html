<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="row mb-4">
        <div class="col-md-12">
            <h2 class="text-center">Teacher Dashboard</h2>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Total Students</h5>
                    <h2 th:text="${totalStudents}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">Total Courses</h5>
                    <h2 th:text="${totalCourses}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4>Quick Actions</h4>
                </div>
                <div class="card-body">
                    <a th:href="@{/teacher/students}" class="btn btn-outline-primary m-1">Manage Students</a>
                    <a th:href="@{/teacher/add-student}" class="btn btn-outline-success m-1">Add Student</a>
                    <a th:href="@{/teacher/courses}" class="btn btn-outline-info m-1">Manage Courses</a>
                    <a th:href="@{/teacher/add-course}" class="btn btn-outline-warning m-1">Add Course</a>
                    <a th:href="@{/teacher/enroll-student}" class="btn btn-outline-secondary m-1">Enroll Student</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
