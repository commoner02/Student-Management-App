<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4>My Profile</h4>
                </div>
                <div class="card-body">
                    <p><strong>Username:</strong> <span th:text="${student.username}"></span></p>
                    <p><strong>Student ID:</strong> <span th:text="${student.studentId}"></span></p>
                    <p><strong>Email:</strong> <span th:text="${student.email}"></span></p>
                    <p><strong>Phone:</strong> <span th:text="${student.phone}"></span></p>
                    <p><strong>Address:</strong> <span th:text="${student.address}"></span></p>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h4>Edit Profile</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/student/profile/update}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Email:</label>
                            <input type="email" class="form-control" name="email"
                                   th:value="${student.email}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone:</label>
                            <input type="text" class="form-control" name="phone"
                                   th:value="${student.phone}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address:</label>
                            <input type="text" class="form-control" name="address"
                                   th:value="${student.address}">
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-info text-white">
                    <h4>My Courses</h4>
                </div>
                <div class="card-body">
                    <div th:if="${student.courseCodes.empty}" class="alert alert-info">
                        You are not enrolled in any courses yet.
                    </div>
                    <ul class="list-group" th:unless="${student.courseCodes.empty}">
                        <li class="list-group-item" th:each="course : ${student.courseCodes}"
                            th:text="${course}"></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
