<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Profile</title>
</head>
<body>
<h2>Student Profile</h2>

<div th:if="${success}" style="color: green" th:text="${success}"></div>

<h3>Your Information (Read-only):</h3>
<p><strong>Username:</strong> <span th:text="${student.user.username}"></span></p>
<p><strong>Student ID/Roll:</strong> <span th:text="${student.studentId}"></span> <em>(Cannot be changed)</em></p>
<p><strong>Department:</strong> <span th:text="${student.department.name}"></span></p>

<h3>Edit Profile Information:</h3>
<form th:action="@{/student/profile/update}" method="post">
    <div>
        <label>Email:</label>
        <input type="email" name="email" th:value="${student.user.email}" required>
    </div>
    <div>
        <label>Phone:</label>
        <input type="text" name="phone" th:value="${student.phone}">
    </div>
    <div>
        <label>Address:</label>
        <input type="text" name="address" th:value="${student.address}">
    </div>
    <button type="submit">Update Profile</button>
</form>

<a th:href="@{/dashboard}">Back to Dashboard</a>
</body>
</html>
