services:
  postgres:
    image: 'postgres:latest'
    container_name: sms_DB
    environment:
      - 'POSTGRES_DB=smsdb'
      - 'POSTGRES_PASSWORD=pass123'
      - 'POSTGRES_USER=admin'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - student-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d smsdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  student-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student_management_app
    ports:
      - '8080:8080'
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/smsdb'
      - 'SPRING_DATASOURCE_USERNAME=admin'
      - 'SPRING_DATASOURCE_PASSWORD=pass123'
      - 'SPRING_JPA_HIBERNATE_DDL_AUTO=update'
      - 'SPRING_JPA_SHOW_SQL=true'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - student-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  student-network:
    driver: bridge